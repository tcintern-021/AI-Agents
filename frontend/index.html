<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Console</title>
    <!-- Google Fonts: Inter & Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Highlight.js Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <!-- Main CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <button id="newChatBtn" class="btn-primary-gradient">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span>+ New Conversation</span>
                </button>
                <button id="sidebarCloseBtn" class="icon-btn mobile-only" aria-label="Close sidebar">✕</button>
            </div>

            <!-- Recent Sessions -->
            <div class="sidebar-section">
                <span class="sidebar-section-title">Saved Conversations</span>
                <div id="sessionList" class="session-list">
                    <!-- Dynamic session list -->
                </div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-content">
            <!-- Top Navigation Header -->
            <header class="app-header">
                <div class="header-left">
                    <button id="sidebarToggleBtn" class="icon-btn" title="Toggle Navigation Sidebar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </button>
                    <div class="brand">
                        <h1>AI Agent Console</h1>
                    </div>
                </div>

                <div class="header-right">
                    <button id="clearChatBtn" class="btn-secondary" title="Clear conversation history">Clear History</button>
                </div>
            </header>

            <!-- Chat Container -->
            <div id="chatContainer" class="chat-container">
                <!-- Messages appended dynamically -->
            </div>

            <!-- Suggestion Chips -->
            <div class="quick-prompts">
                <button class="chip" data-query="Calculate 125 * 37">🔢 125 * 37</button>
                <button class="chip" data-query="What are the working hours?">⏰ Working Hours</button>
                <button class="chip" data-query="What technologies does the project use?">💻 Tech Stack</button>
                <button class="chip" data-query="What is machine learning?">🧠 Machine Learning</button>
            </div>

            <!-- Input Controls -->
            <footer class="input-container">
                <form id="chatForm" class="input-form">
                    <input type="text" id="userInput" class="chat-input" placeholder="Type a message or calculation request..." autocomplete="off" required>
                    <button type="submit" id="sendBtn" class="send-btn">
                        <span>Send</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </form>
            </footer>
        </main>
    </div>

    <!-- Highlight.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <!-- Application JavaScript -->
    <script src="/static/app.js"></script>
</body>
</html>
