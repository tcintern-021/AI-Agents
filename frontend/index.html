<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tool-Calling Assistant</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">🤖</div>
                <div class="brand-text">
                    <h1>AI Agent Studio</h1>
                    <p>LangGraph • LangChain • RAG • Tool Calling</p>
                </div>
            </div>
            <div class="header-actions">
                <div class="status-badge">
                    <span class="status-dot"></span>
                    <span>Agent Ready</span>
                </div>
                <button id="clearBtn" class="btn-secondary">Clear Chat</button>
            </div>
        </header>

        <!-- Chat Transcript -->
        <main id="chatContainer" class="chat-container">
            <!-- Initial Welcome Message -->
            <div class="message-row assistant">
                <span class="sender-label">AI Assistant</span>
                <div class="message-bubble">
                    Hello! I'm your AI Tool-Calling Assistant. I can answer questions directly, run mathematical calculations, or retrieve information from the company knowledge base.
                </div>
            </div>
        </main>

        <!-- Quick Query Chips -->
        <div class="quick-prompts">
            <button class="chip" data-query="Calculate 125 * 37">🔢 Calculate 125 * 37</button>
            <button class="chip" data-query="What are the working hours?">⏰ What are the working hours?</button>
            <button class="chip" data-query="What technologies does the project use?">💻 Project technology stack</button>
            <button class="chip" data-query="What is machine learning?">🧠 What is machine learning?</button>
        </div>

        <!-- Input Area -->
        <footer class="input-container">
            <form id="chatForm" class="input-form">
                <input type="text" id="userInput" class="chat-input" placeholder="Ask a question or request a calculation..." autocomplete="off" required>
                <button type="submit" id="sendBtn" class="send-btn">
                    <span>Send</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </footer>
    </div>

    <!-- Application JavaScript -->
    <script src="/static/app.js"></script>
</body>
</html>
